<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script type="module">
        import { Enso, html, css } from '../src/index';
        import '../src/extras/enso-slot';

        Enso.component("slotting-test", {
            styles: css`
                ::slotted(*)::after {
                    content: " v" attr(data-passes);
                }
            `,
            template: html`
                <enso-slot
                    .on-add="el=>el.dataset.passes = 0"
                    .on-remove="el=>delete el.dataset.passes"
                    .for-each="el=>el.dataset.passes++"
                ></enso-slot>
            `,
        });
    </script>

</head>
<body>
    <slotting-test>
        <div>slotted 1</div>
        <div>slotted 2</div>
    </slotting-test>
</body>

</html>
